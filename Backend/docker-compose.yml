version: '3.8'

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: catalogoamim-db
    environment:
      POSTGRES_USER: catalogoamim
      POSTGRES_PASSWORD: catalogoamim123
      POSTGRES_DB: catalogoamim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogoamim"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (opcional - para cache)
  redis:
    image: redis:7-alpine
    container_name: catalogoamim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: catalogoamim-api
    environment:
      DATABASE_URL: postgresql://catalogoamim:catalogoamim123@postgres:5432/catalogoamim?schema=public
      DIRECT_URL: postgresql://catalogoamim:catalogoamim123@postgres:5432/catalogoamim?schema=public
      NODE_ENV: production
      PORT: 3333
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "false"
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
